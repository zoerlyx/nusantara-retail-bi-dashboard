version: '3.8'
services:
  postgres:
    image: postgres:15-alpine
    container_name: nusantara_db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: nusantara_retail
    ports:
      - "15432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
